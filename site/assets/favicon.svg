<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FD0C9" />
      <stop offset="100%" stop-color="#144C5E" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6F1F5" />
      <stop offset="100%" stop-color="#76A8B4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Shape -->
  <path d="M32 4 L56 12 C56 36 32 58 32 58 C32 58 8 36 8 12 Z" fill="#060A12" stroke="url(#shieldGrad)" stroke-width="2.5" />
  <!-- Inner HUD Accents -->
  <path d="M32 9 L51 16 C51 34 32 52 32 52 C32 52 13 34 13 16 Z" fill="rgba(63, 208, 201, 0.08)" stroke="rgba(63, 208, 201, 0.3)" stroke-width="1" />
  
  <!-- Stylized Top-Down / Forward Car Shape -->
  <!-- Car Cabin / Roof -->
  <path d="M26 25 Q32 23 38 25 L41 33 L23 33 Z" fill="url(#carGrad)" opacity="0.9" />
  <!-- Car Hood and Body -->
  <path d="M24 35 L40 35 L42 45 Q32 47 22 45 Z" fill="#3FD0C9" filter="url(#glow)" />
  <!-- Headlight Beams -->
  <path d="M23 45 L18 53 L26 47 Z" fill="#3FD0C9" opacity="0.6" />
  <path d="M41 45 L46 53 L38 47 Z" fill="#3FD0C9" opacity="0.6" />
  <!-- Center Radar Pulse Dot -->
  <circle cx="32" cy="18" r="2" fill="#3FD0C9" />
  <circle cx="32" cy="18" r="4.5" fill="none" stroke="#3FD0C9" stroke-width="0.8" opacity="0.5" stroke-dasharray="2 1" />
</svg>
